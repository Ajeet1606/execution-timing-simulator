              "name": "What is the difference between debounce and throttle?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Debounce delays execution until a burst of events has stopped for a set period. Throttle allows execution at most once per time interval regardless of how many events fire. Use debounce for search inputs; use throttle for scroll handlers."

              "@type": "Question",

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Rate limiting restricts how many times a function can execute within a fixed time window. Unlike throttle, it queues or drops calls that exceed the limit, making it useful for API call budgeting."
